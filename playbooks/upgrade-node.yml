---
- name: Upgrade Node
  hosts: validators:fullnodes
  become: yes
  gather_facts: yes
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault-{{ env }}.yml
    - ../group_vars/{{ env }}.yml

  tasks:
    # Refresh the Category Labs apt signing key before touching the cache.
    # The key has expired once (2026-05-20) and locked the entire fleet out
    # of `apt update`; the role-shipped bytes are the source of truth, so
    # ensure the host's copy matches before we attempt the upgrade.
    - name: Refresh Category Labs apt signing key
      copy:
        src: ../roles/monad-node/files/category-labs.gpg
        dest: /etc/apt/keyrings/category-labs.gpg
        mode: '0644'

    - name: Refresh monad-status script
      get_url:
        url: "{{ monad_status_url }}"
        dest: /usr/local/bin/monad-status
        mode: '0755'
        force: yes

    - name: Check installed monad version
      command: dpkg-query -W -f='${Version}' monad
      register: installed_version
      changed_when: false
      failed_when: false

    - name: Check triedb migration marker
      stat:
        path: "{{ monad_home }}/.triedb-migrated-{{ monad_version }}"
      register: triedb_migration_marker

    - name: Determine if triedb migration is needed
      set_fact:
        migration_needed: >-
          {{ (triedb_migration_version | default('') | length > 0)
             and (monad_version == triedb_migration_version)
             and not triedb_migration_marker.stat.exists }}

    - name: Skip if already at target version
      block:
        - debug:
            msg: "monad already at {{ monad_version }}, skipping upgrade"
        - meta: end_host
      when:
        - installed_version.rc == 0
        - installed_version.stdout == monad_version
        - not (migration_needed | bool)
        - not (force_upgrade | default(false) | bool)

    - name: Check key dir exists before backup
      stat:
        path: "{{ monad_key_dir }}"
      register: key_dir_stat

    - name: Backup keys and critical config
      archive:
        path:
          - "{{ monad_key_dir }}"
          - "{{ monad_node_config_file }}"
          - "{{ monad_validators_dir }}"
        dest: "{{ monad_home }}/backups/pre-upgrade-{{ monad_version }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
      become_user: "{{ monad_user }}"
      when: key_dir_stat.stat.exists

    - name: Unhold monad package
      dpkg_selections:
        name: monad
        selection: install

    # Install the new binaries while consensus/execution/rpc keep running on
    # the OLD ones (Linux pins the open inode across dpkg's overwrite, so the
    # live processes are unaffected). This shrinks the no-voting window from
    # ~apt-install duration (10–30s on a busy disk) down to just the systemd
    # cycle (~2–3s). The monad package's own monad-bft.service is masked by
    # the monad-node role, and our consensus/execution/rpc units are not
    # owned by the package, so dpkg postinst will not touch live services.
    - name: Upgrade monad package (binaries swap in place; live services unaffected)
      apt:
        name: "monad={{ monad_version }}"
        state: present
        update_cache: yes
        allow_change_held_packages: yes

    - name: Hold monad package version
      dpkg_selections:
        name: monad
        selection: hold

    - name: Stop services (now that new binaries are on disk)
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - "{{ rpc_service_identifier }}"
        - "{{ service_identifier }}"
        - "{{ execution_service_identifier }}"
      failed_when:
        - stop_result is failed
        - "'Could not find the requested service' not in (stop_result.msg | default(''))"
      register: stop_result

    - name: TrieDB migration (hardfork; runs once while services are stopped)
      when:
        - migration_needed | bool
        - not ansible_check_mode
      block:
        - name: Assert no process holds triedb open before migration
          shell: |
            if command -v fuser >/dev/null 2>&1; then
              fuser {{ triedb_config.path }} 2>/dev/null && exit 1 || exit 0
            else
              lsof {{ triedb_config.path }} 2>/dev/null && exit 1 || exit 0
            fi
          register: triedb_holders_pre_migration
          changed_when: false
          failed_when: triedb_holders_pre_migration.rc != 0

        - name: Run triedb metadata migration
          command: "monad-mpt --storage {{ triedb_config.path }} --upgrade"
          register: triedb_migration_result
          failed_when: triedb_migration_result.rc != 0

        - name: Show migration output
          debug:
            var: triedb_migration_result.stdout_lines

        - name: Write migration marker
          copy:
            dest: "{{ monad_home }}/.triedb-migrated-{{ monad_version }}"
            content: "migrated to {{ monad_version }} at {{ ansible_date_time.iso8601 }}\n"
            owner: "{{ monad_user }}"
            group: "{{ monad_group }}"
            mode: '0644'

    - name: Reset failed state and restart counter before liveness gate
      command: "systemctl reset-failed {{ service_identifier }}"
      changed_when: false
      failed_when: false

    - name: Capture journal cursor immediately before starting consensus
      shell: |
        journalctl -u {{ service_identifier }} --show-cursor -n 0 --no-pager \
          | awk '/^-- cursor:/ {print $3}'
      register: journal_cursor
      changed_when: false

    - name: Start services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - "{{ execution_service_identifier }}"
        - "{{ service_identifier }}"
        - "{{ rpc_service_identifier }}"

    - name: Wait for RPC
      uri:
        url: "http://localhost:{{ monad_rpc_port }}"
        method: POST
        body: '{"jsonrpc":"2.0","method":"eth_chainId","id":1}'
        body_format: json
        headers:
          Content-Type: "application/json"
      register: rpc_check
      until: rpc_check.status == 200
      retries: 30
      delay: 10

    - name: Settle window before consensus liveness probe
      pause:
        seconds: 30

    - name: Consensus restart counter since reset (post-upgrade liveness gate)
      shell: |
        systemctl show {{ service_identifier }} -p NRestarts --value
      register: nrestarts
      changed_when: false

    - name: Fail if consensus restarted after reset
      fail:
        msg: "{{ service_identifier }} restarted {{ nrestarts.stdout | trim }} times after reset-failed — panic loop. Aborting rolling upgrade."
      when: (nrestarts.stdout | trim | int) > 1

    - name: Scan journal since cursor for fatal patterns
      shell: |
        journalctl -u {{ service_identifier }} --after-cursor='{{ journal_cursor.stdout | trim }}' --no-pager \
          | grep -E "high qc too far ahead|block tree root|panicked at .*monad-consensus" \
          || true
      register: panic_scan
      changed_when: false
      when: journal_cursor.stdout | trim | length > 0

    - name: Fail if fatal consensus pattern found
      fail:
        msg: "Fatal consensus pattern in journal after upgrade — aborting rollout. Matches:\n{{ panic_scan.stdout }}"
      when:
        - panic_scan is not skipped
        - panic_scan.stdout | default('') | trim | length > 0

    - name: Post-upgrade verification (skipped in --check)
      when: not ansible_check_mode
      block:
        - name: Verify running monad-rpc version matches target
          command: monad-rpc -V
          register: monad_rpc_version
          changed_when: false
          failed_when: ("v" ~ monad_version) not in (monad_rpc_version.stdout ~ monad_rpc_version.stderr)

        - name: Fork-readiness reminder
          debug:
            msg:
              - "Running: {{ (monad_rpc_version.stdout ~ monad_rpc_version.stderr) | trim }}"
              - "Node must be healthy on v{{ monad_version }} before round {{ hardfork_round | default('N/A') }} ({{ monad_network_name }} hardfork)."

        - name: Collect node status (monad-status)
          command: monad-status
          register: monad_status_out
          changed_when: false
          failed_when: false

        - name: Show node status
          debug:
            var: monad_status_out.stdout_lines
