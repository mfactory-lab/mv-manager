---
- name: Upgrade Node
  hosts: validators:fullnodes
  become: yes
  gather_facts: yes
  serial: 1
  any_errors_fatal: true
  max_fail_percentage: 0

  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vault-{{ env }}.yml
    - ../group_vars/{{ env }}.yml

  tasks:
    # Refresh the Category Labs apt signing key before touching the cache.
    # The key has expired once (2026-05-20) and locked the entire fleet out
    # of `apt update`; the role-shipped bytes are the source of truth, so
    # ensure the host's copy matches before we attempt the upgrade.
    - name: Refresh Category Labs apt signing key
      copy:
        src: ../roles/monad-node/files/category-labs.gpg
        dest: /etc/apt/keyrings/category-labs.gpg
        mode: '0644'

    - name: Check installed monad version
      command: dpkg-query -W -f='${Version}' monad
      register: installed_version
      changed_when: false
      failed_when: false

    - name: Skip if already at target version
      block:
        - debug:
            msg: "monad already at {{ monad_version }}, skipping upgrade"
        - meta: end_host
      when:
        - installed_version.rc == 0
        - installed_version.stdout == monad_version
        - not (force_upgrade | default(false) | bool)

    - name: Check key dir exists before backup
      stat:
        path: "{{ monad_key_dir }}"
      register: key_dir_stat

    - name: Backup keys and critical config
      archive:
        path:
          - "{{ monad_key_dir }}"
          - "{{ monad_node_config_file }}"
          - "{{ monad_validators_dir }}"
        dest: "{{ monad_home }}/backups/pre-upgrade-{{ monad_version }}-{{ ansible_date_time.iso8601_basic_short }}.tar.gz"
        format: gz
      become_user: "{{ monad_user }}"
      when: key_dir_stat.stat.exists

    - name: Stop services
      systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - "{{ rpc_service_identifier }}"
        - "{{ service_identifier }}"
        - "{{ execution_service_identifier }}"
      failed_when:
        - stop_result is failed
        - "'Could not find the requested service' not in (stop_result.msg | default(''))"
      register: stop_result

    - name: Unhold monad package
      dpkg_selections:
        name: monad
        selection: install

    - name: Upgrade monad package
      apt:
        name: "monad={{ monad_version }}"
        state: present
        update_cache: yes
        allow_change_held_packages: yes

    - name: Hold monad package version
      dpkg_selections:
        name: monad
        selection: hold

    - name: Reset failed state and restart counter before liveness gate
      command: "systemctl reset-failed {{ service_identifier }}"
      changed_when: false
      failed_when: false

    - name: Capture journal cursor immediately before starting consensus
      shell: |
        journalctl -u {{ service_identifier }} --show-cursor -n 0 --no-pager \
          | awk '/^-- cursor:/ {print $3}'
      register: journal_cursor
      changed_when: false

    - name: Start services
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      loop:
        - "{{ execution_service_identifier }}"
        - "{{ service_identifier }}"
        - "{{ rpc_service_identifier }}"

    - name: Wait for RPC
      uri:
        url: "http://localhost:{{ monad_rpc_port }}"
        method: POST
        body: '{"jsonrpc":"2.0","method":"eth_chainId","id":1}'
        body_format: json
        headers:
          Content-Type: "application/json"
      register: rpc_check
      until: rpc_check.status == 200
      retries: 30
      delay: 10

    - name: Settle window before consensus liveness probe
      pause:
        seconds: 30

    - name: Consensus restart counter since reset (post-upgrade liveness gate)
      shell: |
        systemctl show {{ service_identifier }} -p NRestarts --value
      register: nrestarts
      changed_when: false

    - name: Fail if consensus restarted after reset
      fail:
        msg: "{{ service_identifier }} restarted {{ nrestarts.stdout | trim }} times after reset-failed — panic loop. Aborting rolling upgrade."
      when: (nrestarts.stdout | trim | int) > 1

    - name: Scan journal since cursor for fatal patterns
      shell: |
        journalctl -u {{ service_identifier }} --after-cursor='{{ journal_cursor.stdout | trim }}' --no-pager \
          | grep -E "high qc too far ahead|block tree root|panicked at .*monad-consensus" \
          || true
      register: panic_scan
      changed_when: false
      when: journal_cursor.stdout | trim | length > 0

    - name: Fail if fatal consensus pattern found
      fail:
        msg: "Fatal consensus pattern in journal after upgrade — aborting rollout. Matches:\n{{ panic_scan.stdout }}"
      when:
        - panic_scan is not skipped
        - panic_scan.stdout | default('') | trim | length > 0
