---
# Role enable + image (pinned by digest)
fastlane_enabled: false
fastlane_sidecar_version: "0.0.16"
fastlane_sidecar_image: "ghcr.io/fastlane-labs/fastlane-sidecar"
fastlane_sidecar_image_digest: "sha256:f386d50c6538c4e3482fcb796f12165ca1dba4efb6afcb8304037273531bac7f"

# Runtime
fastlane_sidecar_port: 8765
fastlane_memory_limit: "2g"
fastlane_cpu_pinning: ""
fastlane_log_level: "info"
fastlane_socket_mode: "ro"
fastlane_home: "{{ monad_home }}/fastlane"

# Rootless user-namespace range allocated to monad if /etc/subuid + /etc/subgid
# have no entry for the user. 65536 IDs starting at 100000 matches the default
# range that `useradd` would have assigned had `uidmap` been installed at the
# time monad was created.
fastlane_subid_start: 100000
fastlane_subid_count: 65536
