---
- name: Ensure fastlane home exists
  file:
    path: "{{ fastlane_home }}"
    state: directory
    owner: "{{ monad_user }}"
    group: "{{ monad_group }}"
    mode: '0750'
  tags: [fastlane, deploy]

- name: Render user systemd unit
  template:
    src: fastlane-sidecar.service.j2
    dest: "{{ monad_home }}/.config/systemd/user/fastlane-sidecar.service"
    owner: "{{ monad_user }}"
    group: "{{ monad_group }}"
    mode: '0640'
  notify:
    - Reload user systemd
    - Restart fastlane sidecar
  tags: [fastlane, deploy, config]

- name: Pull sidecar image by digest
  become_user: "{{ monad_user }}"
  environment: "{{ fastlane_user_env }}"
  command: "docker pull {{ fastlane_sidecar_image }}@{{ fastlane_sidecar_image_digest }}"
  register: docker_pull
  changed_when: "'Downloaded newer image' in docker_pull.stdout or 'Pull complete' in docker_pull.stdout"
  when: not ansible_check_mode
  tags: [fastlane, deploy]

- name: Wait for mempool socket to exist
  wait_for:
    path: "{{ monad_mempool_socket }}"
    state: present
    timeout: 60
  tags: [fastlane, deploy]

- name: Stop legacy system fastlane-sidecar so the rootless container can bind 127.0.0.1:{{ fastlane_sidecar_port }}
  become: yes
  systemd:
    name: fastlane-sidecar.service
    state: stopped
    scope: system
  failed_when: false
  tags: [fastlane, deploy]

- name: Flush handlers before enabling unit
  meta: flush_handlers
  tags: [fastlane, deploy]

- name: Enable and start fastlane-sidecar user unit
  become_user: "{{ monad_user }}"
  environment: "{{ fastlane_user_env }}"
  command: systemctl --user enable --now fastlane-sidecar.service
  changed_when: false
  when: not ansible_check_mode
  tags: [fastlane, deploy]

# =============================================================================
# WATCHER: detect stale Docker bind-mount inode after consensus restarts.
# The sidecar container pins the mempool socket inode at start time. When the
# socket is unlink()'d + re-bind()'d by a monad restart, the container reaches
# a phantom inode and gets ECONNREFUSED forever without exiting, so systemd's
# Restart=on-failure never triggers. A .path unit on the socket auto-restarts
# the sidecar whenever the inode changes. Anything else that goes wrong is
# caught by the MevSidecarStale Grafana alert (operator decides — no blind
# auto-restart loop).
# =============================================================================
- name: Render sidecar watcher user units (.path + .service)
  template:
    src: "{{ item }}.j2"
    dest: "{{ monad_home }}/.config/systemd/user/{{ item }}"
    owner: "{{ monad_user }}"
    group: "{{ monad_group }}"
    mode: '0640'
  loop:
    - fastlane-sidecar-watcher.path
    - fastlane-sidecar-watcher.service
  notify:
    - Reload user systemd
  tags: [fastlane, deploy, watchdog]

- name: Flush handlers so user-systemd sees the new units
  meta: flush_handlers
  tags: [fastlane, deploy, watchdog]

- name: Enable and start sidecar .path watcher
  become_user: "{{ monad_user }}"
  environment: "{{ fastlane_user_env }}"
  command: systemctl --user enable --now fastlane-sidecar-watcher.path
  changed_when: false
  when: not ansible_check_mode
  tags: [fastlane, deploy, watchdog]
