---
- name: Stop and disable legacy system unit
  systemd:
    name: fastlane-sidecar
    state: stopped
    enabled: no
  failed_when: false
  tags: [fastlane, legacy]

- name: Purge legacy fastlane-sidecar apt package
  apt:
    name: fastlane-sidecar
    state: absent
    purge: yes
  failed_when: false
  tags: [fastlane, legacy]

- name: Remove legacy apt source list
  file:
    path: /etc/apt/sources.list.d/fastlane.list
    state: absent
  tags: [fastlane, legacy]

- name: Remove legacy apt keyring
  file:
    path: /usr/share/keyrings/fastlane-apt-keyring.gpg
    state: absent
  tags: [fastlane, legacy]

- name: Remove legacy systemd drop-in directory
  file:
    path: /etc/systemd/system/fastlane-sidecar.service.d
    state: absent
  tags: [fastlane, legacy]

- name: Refresh apt cache after source removal
  apt:
    update_cache: yes
  tags: [fastlane, legacy]

- name: Reload system systemd to drop removed unit
  systemd:
    daemon_reload: yes
  tags: [fastlane, legacy]
