---
- name: Health gate (skipped in --check mode)
  when: not ansible_check_mode
  tags: [fastlane, health]
  block:
    - name: Verify fastlane-sidecar user unit reached active state
      become_user: "{{ monad_user }}"
      environment: "{{ fastlane_user_env }}"
      command: systemctl --user is-active fastlane-sidecar.service
      register: unit_active
      changed_when: false
      failed_when: false
      retries: 6
      delay: 5
      until: (unit_active.stdout | default('') | trim) == 'active'

    - name: Fail if user unit did not reach active state
      fail:
        msg: "fastlane-sidecar.service user unit state is '{{ unit_active.stdout | default('') | trim }}' (rc={{ unit_active.rc }}). Health gate aborted."
      when: (unit_active.stdout | default('') | trim) != 'active'

    - name: Verify fastlane-sidecar container is running
      become_user: "{{ monad_user }}"
      environment: "{{ fastlane_user_env }}"
      command: docker inspect fastlane-sidecar --format '{{ "{{" }}.State.Status{{ "}}" }}'
      register: container_running
      changed_when: false
      failed_when: (container_running.stdout | default('') | trim) != 'running'

    - name: Wait for sidecar health endpoint
      uri:
        url: "http://127.0.0.1:{{ fastlane_sidecar_port }}/health"
        method: GET
        return_content: yes
      register: sidecar_health
      until: sidecar_health.status == 200
      retries: 12
      delay: 5

    - name: Display sidecar health
      debug:
        msg: "Sidecar /health: {{ sidecar_health.json | default(sidecar_health.content) }}"
